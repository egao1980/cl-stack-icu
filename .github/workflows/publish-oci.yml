name: Publish OCI Package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Package OCI version (default: from tag or 78.1.3); ICU sources stay ICU_VERSION_DEFAULT"
        required: false
        default: ""
      registry:
        description: "OCI registry"
        required: false
        default: "ghcr.io"

env:
  ICU_VERSION_DEFAULT: "78.1"
  PACKAGE_VERSION_DEFAULT: "78.1.3"
  SBCL_VERSION: 2.6.7
  ROSWELL_VERSION: "26.02.116"
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: darwin
            arch: arm64
            runner: macos-latest
          - os: windows
            arch: amd64
            runner: windows-latest

    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5

      - name: Resolve ICU version
        id: ver
        shell: bash
        run: |
          # ICU upstream release (download tarball) ≠ package semver (tag / OCI).
          # Tag v78.1.1 → package 78.1.1, still build ICU 78.1 sources.
          ICU="${ICU_VERSION_DEFAULT}"
          echo "version=$ICU" >> "$GITHUB_OUTPUT"
          echo "ICU_VERSION=$ICU" >> "$GITHUB_ENV"
          echo "Resolved ICU_VERSION=$ICU (package tag may differ)"

      - name: Install build deps (Linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config curl patchelf

      - name: Install build deps (macOS)
        if: matrix.os == 'darwin'
        run: brew install make || true

      - uses: egao1980/cl-repository/.github/actions/setup-lisp@main
        with:
          sbcl-version: ${{ env.SBCL_VERSION }}
          roswell-version: ${{ env.ROSWELL_VERSION }}

      - uses: egao1980/cl-repository/.github/actions/ci@main
        with:
          phase: install
          system: cl-stack-icu
      - name: ASDF registry for grovel
        shell: bash
        run: |
          echo "CL_SOURCE_REGISTRY=$(pwd)//:$(pwd)/${CL_REPOSITORY_CLIENT_DIR}//:$HOME/.local/share/cl-repository/systems//:" >> "$GITHUB_ENV"

      - name: Build ICU (Unix)
        if: matrix.os != 'windows'
        run: |
          chmod +x scripts/build-icu.sh scripts/stage-grovel.sh
          ./scripts/build-icu.sh
          export CL_STACK_ICU_INCLUDE="$(cat build/cl-stack-icu-include)"
          ./scripts/stage-grovel.sh cl-stack-icu
          mkdir -p native-bundle/lib native-bundle/grovel
          cp -a "lib/${{ matrix.os }}-${{ matrix.arch }}/." native-bundle/lib/
          cp -a "grovel/${{ matrix.os }}-${{ matrix.arch }}/." native-bundle/grovel/

      - name: Build ICU (Windows / MSVC)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          .\scripts\build-icu.ps1
          "CL_STACK_ICU_INCLUDE=$env:CL_STACK_ICU_INCLUDE" |
            Out-File -FilePath $env:GITHUB_ENV -Append
          $lib = Resolve-Path "lib\windows-amd64"
          "CL_STACK_ICU_NATIVE=$lib" | Out-File -FilePath $env:GITHUB_ENV -Append
          "Path=$lib;$env:Path" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install MinGW for grovel only (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          choco install mingw -y
          $mingw = @(
            "C:\ProgramData\mingw64\mingw64\bin",
            "C:\mingw64\bin"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $mingw) { throw "mingw bin dir not found after choco install" }
          "Path=$mingw;$env:Path" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Stage grovel (Windows)
        if: matrix.os == 'windows'
        shell: bash
        run: |
          chmod +x scripts/stage-grovel.sh
          ./scripts/stage-grovel.sh cl-stack-icu
          mkdir -p native-bundle/lib native-bundle/grovel
          cp -a "lib/${{ matrix.os }}-${{ matrix.arch }}/." native-bundle/lib/
          cp -a "grovel/${{ matrix.os }}-${{ matrix.arch }}/." native-bundle/grovel/

      - name: Upload native+grovel artifact
        uses: actions/upload-artifact@v6
        with:
          name: native-${{ matrix.os }}-${{ matrix.arch }}
          path: native-bundle/

  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - id: ver
        shell: bash
        run: |
          V="${{ inputs.version }}"
          if [ -z "$V" ] && [[ "${GITHUB_REF_NAME}" == v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          fi
          [ -z "$V" ] && V="${PACKAGE_VERSION_DEFAULT}"
          echo "version=$V" >> "$GITHUB_OUTPUT"

  publish:
    needs: [build, resolve-version]
    permissions:
      contents: read
      packages: write
    uses: egao1980/cl-repository/.github/workflows/publish-native-package.yml@main
    with:
      package-name: cl-stack-icu
      version: ${{ needs.resolve-version.outputs.version }}
      registry: ${{ inputs.registry || 'ghcr.io' }}
      packager-tag: "0.12.0"
      source-paths: |
        cl-stack-icu.asd
        src
        native
        LICENSE
        README.md
        NOTICE
    secrets: inherit
