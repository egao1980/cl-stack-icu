name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: cl-stack-icu-test-${{ github.ref }}
  cancel-in-progress: true

env:
  SBCL_VERSION: 2.6.7
  ROSWELL_VERSION: "26.02.116"
  ICU_VERSION: "78.1"
  CL_REPOSITORY_CLIENT_IMAGE: "ghcr.io/egao1980/cl-repository/cl-repository-client"
  CL_REPOSITORY_CLIENT_VERSION: "latest"
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform_os: linux
            platform_arch: amd64
          - os: macos-latest
            platform_os: darwin
            platform_arch: arm64
          - os: windows-latest
            platform_os: windows
            platform_arch: amd64

    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v5

      - uses: oras-project/setup-oras@v2
        with:
          version: 1.2.3

      - name: Pull cl-repository-client (OCI)
        shell: bash
        run: |
          echo "${GITHUB_TOKEN}" | oras login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          rm -rf /tmp/cl-repo-pull .cl-repository
          mkdir -p /tmp/cl-repo-pull .cl-repository
          CLIENT_VER="${CL_REPOSITORY_CLIENT_VERSION}"
          if [ -z "${CLIENT_VER}" ] || [ "${CLIENT_VER}" = "latest" ]; then
            CLIENT_VER=$(oras manifest fetch "${CL_REPOSITORY_CLIENT_IMAGE}:latest" \
              | python3 -c 'import sys,json; print(json.load(sys.stdin)["annotations"]["org.opencontainers.image.version"])')
            : "${CLIENT_VER:?failed to resolve cl-repository-client from :latest anchor}"
            echo "Resolved cl-repository-client → ${CLIENT_VER}"
          fi
          oras pull "${CL_REPOSITORY_CLIENT_IMAGE}:${CLIENT_VER}" -o /tmp/cl-repo-pull
          for f in /tmp/cl-repo-pull/*.tar.gz; do
            tar -xzf "$f" -C .cl-repository
          done
          CLIENT_DIR="$(find .cl-repository -maxdepth 1 -type d -name 'cl-oci-*' | head -1)"
          : "${CLIENT_DIR:?cl-oci-* not found after oras pull}"
          echo "CL_REPOSITORY_CLIENT_DIR=${CLIENT_DIR}" >> "$GITHUB_ENV"

      - name: Install build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config curl patchelf

      - name: Install build deps (macOS)
        if: runner.os == 'macOS'
        run: brew install make || true

      - name: Build ICU (Unix)
        if: runner.os != 'Windows'
        run: |
          chmod +x scripts/build-icu.sh scripts/stage-grovel.sh
          ./scripts/build-icu.sh
          export CL_STACK_ICU_INCLUDE="$(cat build/cl-stack-icu-include)"
          export CL_STACK_ICU_NATIVE="$(pwd)/lib/${{ matrix.platform_os }}-${{ matrix.platform_arch }}"
          echo "CL_STACK_ICU_INCLUDE=${CL_STACK_ICU_INCLUDE}" >> "$GITHUB_ENV"
          echo "CL_STACK_ICU_NATIVE=${CL_STACK_ICU_NATIVE}" >> "$GITHUB_ENV"

      - name: Build ICU (Windows / MSVC)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\scripts\build-icu.ps1
          "CL_STACK_ICU_INCLUDE=$env:CL_STACK_ICU_INCLUDE" |
            Out-File -FilePath $env:GITHUB_ENV -Append
          $lib = Resolve-Path "lib\windows-amd64"
          "CL_STACK_ICU_NATIVE=$lib" | Out-File -FilePath $env:GITHUB_ENV -Append
          "Path=$lib;$env:Path" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install MinGW for grovel only (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install mingw -y
          $mingw = @(
            "C:\ProgramData\mingw64\mingw64\bin",
            "C:\mingw64\bin"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $mingw) { throw "mingw bin dir not found after choco install" }
          "Path=$mingw;$env:Path" | Out-File -FilePath $env:GITHUB_ENV -Append
          & "$mingw\gcc.exe" --version | Select-Object -First 1

      - name: Install Roswell (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -sL https://raw.githubusercontent.com/roswell/roswell/master/scripts/install-for-ci.sh | bash
          echo "$HOME/.roswell/bin" >> "$GITHUB_PATH"

      - name: Install Roswell (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -sL "https://github.com/roswell/roswell/releases/download/v${ROSWELL_VERSION}/roswell_${ROSWELL_VERSION}_amd64.zip" \
            -o /tmp/roswell.zip
          rm -rf /c/roswell
          mkdir -p /c/roswell
          unzip -qo /tmp/roswell.zip -d /c/roswell
          echo "/c/roswell/roswell" >> "$GITHUB_PATH"
          echo "$HOME/.roswell/bin" >> "$GITHUB_PATH"
          /c/roswell/roswell/ros.exe version

      - name: Install SBCL
        shell: bash
        run: |
          ros install "sbcl-bin/$SBCL_VERSION"
          ros use "sbcl-bin/$SBCL_VERSION"

      - name: Bootstrap cl-repository-client (QL deps for client only)
        shell: bash
        run: |
          ros -e '(ql:quickload (quote ("yason" "ironclad" "babel" "dexador" "quri" "chipz" "flexi-streams" "cl-ppcre" "cl-base64" "trivial-features" "salza2" "archive")) :silent t)' -q

      - name: Install Lisp deps
        shell: bash
        run: |
          export CL_SOURCE_REGISTRY="$(pwd)//:$(pwd)/${CL_REPOSITORY_CLIENT_DIR}//:"
          ros -l scripts/ci-install.lisp -q

      - name: Stage grovel
        shell: bash
        run: |
          chmod +x scripts/stage-grovel.sh
          export CL_SOURCE_REGISTRY="$(pwd)//:$(pwd)/${CL_REPOSITORY_CLIENT_DIR}//:$HOME/.local/share/cl-repository/systems//:"
          ./scripts/stage-grovel.sh cl-stack-icu
          # Consumer-style cache path so asd prefers grovel-cache over live grovel.
          mkdir -p grovel-cache
          cp -f "grovel/${{ matrix.platform_os }}-${{ matrix.platform_arch }}/grovel.cffi.lisp" \
            grovel-cache/grovel.cffi.lisp

      - name: Test cl-stack-icu
        shell: bash
        run: |
          export CL_SOURCE_REGISTRY="$(pwd)//:$(pwd)/${CL_REPOSITORY_CLIENT_DIR}//:$HOME/.local/share/cl-repository/systems//:"
          export CL_STACK_ICU_NATIVE="${CL_STACK_ICU_NATIVE:-$(pwd)/lib/${{ matrix.platform_os }}-${{ matrix.platform_arch }}}"
          ros -l scripts/ci-test.lisp -q
