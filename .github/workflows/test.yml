name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: cl-stack-icu-test-${{ github.ref }}
  cancel-in-progress: true

env:
  SBCL_VERSION: 2.6.7
  ROSWELL_VERSION: "26.02.116"
  ICU_VERSION: "78.1"
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform_os: linux
            platform_arch: amd64
          - os: macos-latest
            platform_os: darwin
            platform_arch: arm64
          - os: windows-latest
            platform_os: windows
            platform_arch: amd64

    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v5

      - uses: egao1980/cl-repository/.github/actions/setup-client@main

      - name: Install build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config curl patchelf

      - name: Install build deps (macOS)
        if: runner.os == 'macOS'
        run: brew install make || true

      - name: Build ICU (Unix)
        if: runner.os != 'Windows'
        run: |
          chmod +x scripts/build-icu.sh scripts/stage-grovel.sh
          ./scripts/build-icu.sh
          export CL_STACK_ICU_INCLUDE="$(cat build/cl-stack-icu-include)"
          export CL_STACK_ICU_NATIVE="$(pwd)/lib/${{ matrix.platform_os }}-${{ matrix.platform_arch }}"
          echo "CL_STACK_ICU_INCLUDE=${CL_STACK_ICU_INCLUDE}" >> "$GITHUB_ENV"
          echo "CL_STACK_ICU_NATIVE=${CL_STACK_ICU_NATIVE}" >> "$GITHUB_ENV"

      - name: Build ICU (Windows / MSVC)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\scripts\build-icu.ps1
          "CL_STACK_ICU_INCLUDE=$env:CL_STACK_ICU_INCLUDE" |
            Out-File -FilePath $env:GITHUB_ENV -Append
          $lib = Resolve-Path "lib\windows-amd64"
          "CL_STACK_ICU_NATIVE=$lib" | Out-File -FilePath $env:GITHUB_ENV -Append
          "Path=$lib;$env:Path" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install MinGW for grovel only (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install mingw -y
          $mingw = @(
            "C:\ProgramData\mingw64\mingw64\bin",
            "C:\mingw64\bin"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $mingw) { throw "mingw bin dir not found after choco install" }
          "Path=$mingw;$env:Path" | Out-File -FilePath $env:GITHUB_ENV -Append
          & "$mingw\gcc.exe" --version | Select-Object -First 1

      - uses: egao1980/cl-repository/.github/actions/setup-roswell@main
        with:
          sbcl-version: ${{ env.SBCL_VERSION }}
          roswell-version: ${{ env.ROSWELL_VERSION }}

      - uses: egao1980/cl-repository/.github/actions/ci@main
        with:
          phase: install
          system: cl-stack-icu

      - name: Stage grovel
        shell: bash
        run: |
          chmod +x scripts/stage-grovel.sh
          ./scripts/stage-grovel.sh cl-stack-icu
          # Consumer-style cache path so asd prefers grovel-cache over live grovel.
          mkdir -p grovel-cache
          cp -f "grovel/${{ matrix.platform_os }}-${{ matrix.platform_arch }}/grovel.cffi.lisp" \
            grovel-cache/grovel.cffi.lisp

      - uses: egao1980/cl-repository/.github/actions/ci@main
        with:
          phase: test
          system: cl-stack-icu
        env:
          CL_STACK_ICU_NATIVE: ${{ env.CL_STACK_ICU_NATIVE }}
          CL_STACK_ICU_INCLUDE: ${{ env.CL_STACK_ICU_INCLUDE }}
